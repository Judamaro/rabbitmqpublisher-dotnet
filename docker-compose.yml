services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rabbitmq-publisher-app
    environment:
      # Development applies pending migrations at startup and exposes Swagger UI.
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__PublisherMessage: Host=postgres;Port=5432;Database=rabbitmq_publisher;Username=postgres;Password=postgres
      RabbitMQOptions__Name: rabbitmq-publisher
      RabbitMQOptions__Host: rabbitmq
      RabbitMQOptions__User: guest
      RabbitMQOptions__Pwd: guest
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  postgres:
    image: postgres:17
    container_name: rabbitmq-publisher-postgres
    environment:
      POSTGRES_DB: rabbitmq_publisher
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d rabbitmq_publisher"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq-publisher-rabbitmq
    # Running as the image's rabbitmq user keeps the healthcheck from creating a root-owned .erlang.cookie.
    user: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10

volumes:
  postgres-data:
  rabbitmq-data:
